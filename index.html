<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SCN">
<title>Flughafen Saarbrücken</title>
<style>
html, body { margin: 0; padding: 0; background: #0d0d0d; height: 100%; overflow: hidden; }
body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: bold;
  color: #f2f2f2;
  -webkit-text-size-adjust: none;
  -webkit-user-select: none;
  user-select: none;
  cursor: pointer; /* nötig, damit ältere iPads Tippen als Klick melden */
}
#board, #hero { position: absolute; left: 0; top: 0; white-space: nowrap; }
.hidden { display: none; }
#hero .row { margin-bottom: .22em; }
#hero .title { margin-bottom: .45em; }
.row { height: 1.25em; margin-bottom: .32em; }
.title { margin-bottom: .55em; }
.labels { height: auto; margin-bottom: .25em; font-size: .38em; color: #ffd200; letter-spacing: .08em; }
.labels div { display: inline-block; vertical-align: top; }
.col { display: inline-block; vertical-align: top; }
.gap { display: inline-block; width: .5em; }
.right { float: right; }
.cell {
  display: inline-block;
  position: relative;
  width: .78em;
  height: 1.25em;
  line-height: 1.25em;
  margin-right: .08em;
  text-align: center;
  vertical-align: top;
  overflow: hidden;
  border-radius: .07em;
  background: #1b1b1b;
  background: -webkit-linear-gradient(top, #2c2c2c 0%, #212121 49%, #161616 51%, #1d1d1d 100%);
  background: linear-gradient(to bottom, #2c2c2c 0%, #212121 49%, #161616 51%, #1d1d1d 100%);
  box-shadow: 0 .03em .06em rgba(0,0,0,.8);
}
.cell:after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px; margin-top: -1px;
  background: #050505;
}
.cell span { display: block; }
.yellow .cell span { color: #ffd200; }
.fa { -webkit-animation: fa .07s linear; animation: fa .07s linear; }
.fb { -webkit-animation: fb .07s linear; animation: fb .07s linear; }
@-webkit-keyframes fa { 0% { -webkit-transform: scaleY(1); } 50% { -webkit-transform: scaleY(.15); opacity: .6; } 100% { -webkit-transform: scaleY(1); } }
@-webkit-keyframes fb { 0% { -webkit-transform: scaleY(1); } 50% { -webkit-transform: scaleY(.15); opacity: .6; } 100% { -webkit-transform: scaleY(1); } }
@keyframes fa { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); opacity: .6; } 100% { transform: scaleY(1); } }
@keyframes fb { 0% { transform: scaleY(1); } 50% { transform: scaleY(.15); opacity: .6; } 100% { transform: scaleY(1); } }
#foot { position: absolute; left: 0; right: 0; bottom: .6em; text-align: center; font-size: 12px; color: #555; font-weight: normal; }
</style>
</head>
<body>
<div id="hero"></div>
<div id="board" class="hidden"></div>
<div id="foot"></div>

<script>
// Bewusst altes JavaScript (ES5), damit es auch auf alten iPads läuft.
(function () {
  var API = 'https://api.pocket-rocket.io/v1/public/items/arrival_departure';
  var AUTH = 'Basic ' + btoa('scn:93ncsjzz1bhjA!'); // öffentlicher Zugang der Flughafen-Webseite
  var ROWS = 8;               // Anzahl Flugzeilen
  var KEEP_MINUTES = 15;      // Gestartete/gelandete Flüge so lange noch zeigen
  var REFRESH_MINUTES = 5;    // Daten neu laden
  var TICK_MS = 45;           // Tempo der Fallblätter
  var LIST_SECONDS = 60;      // Nach so vielen Sekunden zurück zur Großansicht
  var HERO_W = 15;            // Breite der Großansicht in Zeichen
  // Defekter Streifen am Bildschirmrand: ?rand=unten (Standard), ?rand=oben oder ?rand=aus
  var RAND = (location.search.match(/rand=(oben|unten|aus)/) || [0, 'unten'])[1];
  var STREIFEN = RAND === 'aus' ? 0 : 0.22; // Anteil der Bildschirmhöhe, der frei bleibt

  var CHARS = ' ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ0123456789:.-/';
  var DAYS = ['SO', 'MO', 'DI', 'MI', 'DO', 'FR', 'SA'];
  var COLS = [
    { key: 'tag',   w: 2,  label: 'TAG' },
    { key: 'zeit',  w: 5,  label: 'ZEIT' },
    { key: 'flug',  w: 6,  label: 'FLUG' },
    { key: 'dir',   w: 4,  label: '' },
    { key: 'ort',   w: 14, label: 'ZIEL / HERKUNFT' },
    { key: 'info',  w: 15, label: 'BEMERKUNG' }
  ];
  var CELL_EM = 0.86, GAP_EM = 0.5;

  var board = document.getElementById('board');
  var hero = document.getElementById('hero');
  var heroCells = {};
  var showList = false, backTimer = null;
  var foot = document.getElementById('foot');
  var moving = [];
  var flights = [];
  var lastOk = null;

  // ---------- Fallblatt-Zellen ----------
  function makeCells(parent, n) {
    var list = [];
    for (var i = 0; i < n; i++) {
      var el = document.createElement('div');
      el.className = 'cell';
      var sp = document.createElement('span');
      sp.innerHTML = '&nbsp;';
      el.appendChild(sp);
      parent.appendChild(el);
      list.push({ span: sp, cur: ' ', target: ' ', flip: false });
    }
    return list;
  }

  function setText(cells, text) {
    text = (text || '').toUpperCase();
    for (var i = 0; i < cells.length; i++) {
      var ch = text.charAt(i) || ' ';
      var c = cells[i];
      if (c.target === ch) continue;
      c.target = ch;
      if (moving.indexOf(c) < 0) moving.push(c);
    }
  }

  function show(c, ch) {
    c.cur = ch;
    c.span.innerHTML = ch === ' ' ? '&nbsp;' : ch;
    c.flip = !c.flip;
    c.span.className = c.flip ? 'fa' : 'fb';
  }

  function tick() {
    for (var i = moving.length - 1; i >= 0; i--) {
      var c = moving[i];
      if (c.cur === c.target) { moving.splice(i, 1); continue; }
      var idx = CHARS.indexOf(c.cur);
      if (CHARS.indexOf(c.target) < 0 || idx < 0) { show(c, c.target); continue; }
      show(c, CHARS.charAt((idx + 1) % CHARS.length));
    }
  }

  // ---------- Aufbau der Tafel ----------
  var titleCells, clockCells, labelEls = [], rows = [];
  var totalCells = 0;
  for (var k = 0; k < COLS.length; k++) totalCells += COLS[k].w;

  function build() {
    var title = document.createElement('div');
    title.className = 'row title yellow';
    var clock = document.createElement('div');
    clock.className = 'col right';
    clockCells = makeCells(clock, 5);
    title.appendChild(clock);
    var t = document.createElement('div');
    t.className = 'col';
    titleCells = makeCells(t, 20);
    title.appendChild(t);
    board.appendChild(title);

    var labels = document.createElement('div');
    labels.className = 'labels';
    for (var i = 0; i < COLS.length; i++) {
      var l = document.createElement('div');
      l.style.width = (COLS[i].w * CELL_EM / 0.38 + (i < COLS.length - 1 ? GAP_EM / 0.38 : 0)) + 'em';
      labels.appendChild(l);
      labelEls.push(l);
    }
    board.appendChild(labels);

    for (var r = 0; r < ROWS; r++) {
      var row = document.createElement('div');
      row.className = 'row';
      var rowCells = {};
      for (var j = 0; j < COLS.length; j++) {
        var col = document.createElement('div');
        col.className = 'col';
        rowCells[COLS[j].key] = makeCells(col, COLS[j].w);
        row.appendChild(col);
        if (j < COLS.length - 1) {
          var g = document.createElement('div');
          g.className = 'gap';
          row.appendChild(g);
        }
      }
      board.appendChild(row);
      rows.push(rowCells);
    }
    buildHero();
    fit();
  }

  function heroRow(cls, n) {
    var row = document.createElement('div');
    row.className = 'row' + (cls ? ' ' + cls : '');
    var col = document.createElement('div');
    col.className = 'col';
    var cells = makeCells(col, n);
    row.appendChild(col);
    hero.appendChild(row);
    return { row: row, cells: cells };
  }

  function buildHero() {
    heroCells.line1 = heroRow('', HERO_W).cells;
    heroCells.dir = heroRow('yellow', HERO_W).cells;
    heroCells.ort = heroRow('', HERO_W).cells;
    heroCells.info = heroRow('', HERO_W).cells;
  }

  function place(el, wEm, hEm) {
    var W = window.innerWidth, H = window.innerHeight;
    var top0 = RAND === 'oben' ? H * STREIFEN : 0;
    var usable = H * (1 - STREIFEN);
    var size = Math.min(W * 0.95 / wEm, usable * 0.9 / hEm);
    el.style.fontSize = size + 'px';
    el.style.left = Math.round((W - wEm * size) / 2) + 'px';
    el.style.top = Math.round(top0 + (usable - hEm * size) / 2) + 'px';
    foot.style.bottom = Math.round((RAND === 'unten' ? H * STREIFEN : 0) + 8) + 'px';
  }

  function fit() {
    place(hero, HERO_W * CELL_EM, 4 * (1.25 + 0.22));
    fitList();
  }

  function fitList() {
    var wEm = totalCells * CELL_EM + (COLS.length - 1) * GAP_EM;
    var hEm = 1.25 + 0.55 + 0.38 * 1.3 + 0.25 + ROWS * (1.25 + 0.32);
    place(board, wEm, hEm);
    var clockParent = clockCells[0].span.parentNode.parentNode;
    clockParent.parentNode.style.width = (wEm + 0.1) + 'em';
  }

  // ---------- Daten ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function dayCode(datum) {
    var p = datum.split('-');
    return DAYS[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  }

  function remark(f) {
    var e = (f.erwartet || '').replace(/^\s+|\s+$/g, '');
    if (/^\d\d:\d\d$/.test(e)) return 'ERWARTET ' + e;
    if (e) return e;
    if (f.ett && f.plan && f.ett !== f.plan) return 'ERWARTET ' + f.ett;
    return '';
  }

  // Zeitpunkt, an dem das Flugzeug am Himmel zu sehen ist (Minuten seit 1970)
  function eventTime(f) {
    var e = (f.erwartet || '').match(/(\d\d):(\d\d)/);
    var t = e ? e[1] + ':' + e[2] : (f.ett || f.plan || '00:00');
    var d = f.datum.split('-'), h = t.split(':');
    return new Date(+d[0], +d[1] - 1, +d[2], +h[0], +h[1]).getTime() / 60000;
  }

  function convert(list, dir) {
    var out = [];
    list = list || [];
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      out.push({
        when: eventTime(f),
        tag: dayCode(f.datum),
        zeit: f.plan || '',
        flug: (f.flugnr || '').replace(/\s+/g, ' '),
        dir: dir,
        ort: f.ort || '',
        info: remark(f)
      });
    }
    return out;
  }

  function load() {
    var x = new XMLHttpRequest();
    x.open('GET', API + '?t=' + Date.now(), true);
    x.setRequestHeader('Authorization', AUTH);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      try {
        var plan = JSON.parse(x.responseText).resources[0].data.flugplan;
        flights = convert(plan.abflug && plan.abflug.flug, 'NACH')
          .concat(convert(plan.ankunft && plan.ankunft.flug, 'VON'));
        flights.sort(function (a, b) { return a.when - b.when; });
        lastOk = new Date();
        foot.innerHTML = 'Daten: Flughafen Saarbrücken · Stand ' + pad(lastOk.getHours()) + ':' + pad(lastOk.getMinutes());
      } catch (err) {
        foot.innerHTML = 'Keine Verbindung zum Flughafen · neuer Versuch in 1 Minute';
        setTimeout(load, 60000);
        return;
      }
      render();
    };
    x.send();
  }

  function render() {
    setText(titleCells, 'NÄCHSTE FLÜGE');
    for (var i = 0; i < COLS.length; i++) labelEls[i].innerHTML = COLS[i].label;
    var now = Date.now() / 60000, list = [];
    for (var n = 0; n < flights.length; n++) {
      if (flights[n].when >= now - KEEP_MINUTES) list.push(flights[n]);
    }
    renderHero(list[0]);
    for (var r = 0; r < ROWS; r++) {
      var f = list[r];
      for (var j = 0; j < COLS.length; j++) {
        var key = COLS[j].key;
        var txt = f ? f[key] : '';
        if (!f && r === 0 && key === 'ort' && lastOk) txt = 'KEINE FLÜGE';
        setText(rows[r][key], txt);
      }
    }
  }

  function renderHero(f) {
    if (!f) {
      setText(heroCells.line1, '');
      setText(heroCells.dir, '');
      setText(heroCells.ort, lastOk ? 'KEINE FLÜGE' : 'LADE DATEN');
      setText(heroCells.info, '');
      return;
    }
    var left = f.tag + ' ' + f.zeit;
    var spaces = HERO_W - left.length - f.flug.length;
    setText(heroCells.line1, left + new Array(Math.max(spaces, 1) + 1).join(' ') + f.flug);
    setText(heroCells.dir, f.dir === 'NACH' ? 'START NACH' : 'LANDUNG AUS');
    setText(heroCells.ort, shorten(f.ort, HERO_W));
    setText(heroCells.info, f.info);
  }

  // Zu lange Ortsnamen an einer Wortgrenze kürzen (PALMA DE MALLORCA -> PALMA DE)
  function shorten(txt, n) {
    if (txt.length <= n) return txt;
    var cut = txt.lastIndexOf(' ', n);
    return cut > 3 ? txt.substring(0, cut) : txt.substring(0, n);
  }

  function clock() {
    var d = new Date();
    var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
    setText(clockCells, t);
  }

  function toggleView() {
    showList = !showList;
    board.className = showList ? '' : 'hidden';
    hero.className = showList ? 'hidden' : '';
    if (backTimer) clearTimeout(backTimer);
    if (showList) backTimer = setTimeout(toggleView, LIST_SECONDS * 1000);
  }

  build();
  clock();
  render();
  load();
  setInterval(tick, TICK_MS);
  setInterval(clock, 1000);
  setInterval(render, 60000);
  document.body.addEventListener('click', toggleView);
  setInterval(load, REFRESH_MINUTES * 60000);
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
})();
</script>
</body>
</html>
